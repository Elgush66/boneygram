<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - BoneyGram</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background:linear-gradient(135deg,#eef2f7,#dfe9f3);
}

/* ===== CONTAINER ===== */
.container{
    max-width:420px;
    margin:auto;
    padding:18px;
}

/* ===== TOPBAR ===== */
.topbar{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px;
    margin-bottom:20px;

    background:white;
    border-radius:16px;

    box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

.back-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f1f3f6;
    cursor:pointer;
}

.back-btn:active{
    transform:scale(0.9);
}

.title{
    font-size:18px;
    font-weight:600;
}

/* ===== CARD ===== */
.card{
    background:white;
    padding:24px;
    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.section-title{
    margin-bottom:18px;
    font-size:20px;
    font-weight:700;
}

/* ===== ERROR ===== */
.error-box{
    display:flex;
    align-items:center;
    gap:8px;

    background:#ffe5e5;
    color:#d32f2f;

    padding:12px;
    border-radius:12px;
    margin-bottom:14px;
}

/* ===== INPUT ===== */
.input-group{
    position:relative;
    margin-bottom:14px;
}

.input-group i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#00c853;
}

.input-group input{
    width:100%;
    padding:14px 14px 14px 40px;

    border-radius:14px;
    border:none;
    outline:none;

    background:#f4f6f9;
    font-size:15px;
}

.input-group input:focus{
    background:#eef7ff;
    box-shadow:0 0 0 2px rgba(0,176,255,0.2);
}

/* ===== BUTTON ===== */
button{
    width:100%;
    padding:15px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#ff9800,#ff6f00);
    color:white;

    font-size:16px;
    font-weight:600;

    cursor:pointer;
    transition:0.2s;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

button:active{
    transform:scale(0.97);
}

/* LOADING */
.loading{
    pointer-events:none;
    opacity:0.8;
}

.loading::after{
    content:"";
    width:18px;
    height:18px;
    border:3px solid white;
    border-top:3px solid transparent;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* ===== REGISTER LINK ===== */
.register{
    margin-top:18px;
    text-align:center;
}

.register a{
    display:block;
    margin-top:10px;

    padding:14px;
    border-radius:14px;

    background:#f4f6f9;
    text-decoration:none;
    color:#333;
    font-weight:600;
}

.register a:active{
    transform:scale(0.97);
}

</style>
</head>

<body>

<div class="container">

    <!-- TOPBAR -->
    <div class="topbar">
        <button class="back-btn" onclick="window.location.href='/'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="title">Connexion</div>
    </div>

    <!-- CARD -->
    <div class="card">

        <h3 class="section-title">Se connecter</h3>

        {% if error %}
        <div class="error-box">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" onsubmit="handleLogin(this)">

            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="text" name="telephone" required placeholder="Téléphone">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" required placeholder="Mot de passe">
            </div>

            <button type="submit" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Connexion
            </button>

        </form>

        <!-- REGISTER -->
        <div class="register">
            <p>Pas de compte ?</p>
            <a href="/register">Créer un compte</a>
        </div>

    </div>

</div>

<script>
function handleLogin(){
    const btn = document.getElementById("loginBtn");
    btn.classList.add("loading");
    btn.innerHTML = "Connexion...";
}
</script>

</body>
</html>
